# Throwaway probe: does QtPass build for Android at all, and what does the
# APK do when it starts? Not for IJHack/QtPass.
name: Android probe
on:
  push:
    branches: [android-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      QT_VERSION: "6.8.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: NDK the Qt version expects
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          autodesktop: true
          cache: true
      - name: Build src and main
        run: |
          set -x
          mkdir build && cd build
          "$QT_ROOT_DIR/bin/qmake" ../qtpass.pro CONFIG+=release ANDROID_ABIS=arm64-v8a
          make -j"$(nproc)" sub-src 2>&1 | tail -20
          # Android's qmake suffixes the ABI to the static library too;
          # main.pro links libqtpass.a.
          cp src/libqtpass_arm64-v8a.a src/libqtpass.a
          make -j"$(nproc)" sub-main 2>&1 | tail -40
          find . -name '*.so' -o -name '*.a' -o -name '*deployment-settings.json' | head
      - name: Package the APK
        run: |
          set -x
          cd build
          mkdir -p android-build/libs/arm64-v8a
          cp main/libqtpass_arm64-v8a.so android-build/libs/arm64-v8a/
          "$QT_ROOT_DIR/../gcc_64/bin/androiddeployqt" \
            --input main/android-qtpass-deployment-settings.json \
            --output android-build --android-platform android-35 \
            --jdk "$JAVA_HOME" --gradle 2>&1 | tail -40
          find android-build -name '*.apk' -exec ls -l {} +
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qtpass-android-probe
          path: |
            build/android-build/build/outputs/apk/**/*.apk
            build/main/android-qtpass-deployment-settings.json
          if-no-files-found: warn

  # The APK's native library is arm64-v8a; an x86_64 emulator can't run it
  # without translation, so this runs on an Apple Silicon runner, which can
  # boot an arm64 system image directly.
  run:
    needs: apk
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qtpass-android-probe
          path: artifact
      - name: Boot an arm64 emulator and launch the APK
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 34
          arch: arm64-v8a
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 1200
          # No forced software GPU: let the emulator use the host's
          # hardware acceleration, which is the point of an arm64 runner.
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            apk=$(find artifact -name '*.apk' | head -1)
            pkg=org.qtproject.example.qtpass
            activity=org.qtproject.qt.android.bindings.QtActivity
            adb install -r "$apk"
            adb logcat -c
            adb shell am start -n "$pkg/$activity"
            sleep 15
            adb shell "pidof $pkg || ps -A | grep $pkg" && echo "ALIVE after 15s" || echo "NOT RUNNING after 15s (crashed or exited)"
            adb logcat -d > logcat.txt
            echo "---- lines mentioning the app or a crash ----"
            grep -i "$pkg\|fatal\|androidruntime" logcat.txt | tail -200
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qtpass-android-probe-logcat
          path: logcat.txt
          if-no-files-found: warn
