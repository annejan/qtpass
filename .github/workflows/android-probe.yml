# Throwaway probe: does QtPass build for Android at all, and what does the
# APK do when it starts? Not for IJHack/QtPass.
name: Android probe
on:
  push:
    branches: [android-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      QT_VERSION: "6.8.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: NDK the Qt version expects
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          autodesktop: true
          cache: true
      - name: Build src and main
        run: |
          set -x
          mkdir build && cd build
          "$QT_ROOT_DIR/bin/qmake" ../qtpass.pro CONFIG+=release ANDROID_ABIS=arm64-v8a
          make -j"$(nproc)" sub-src 2>&1 | tail -20
          # Android's qmake suffixes the ABI to the static library too;
          # main.pro links libqtpass.a.
          cp src/libqtpass_arm64-v8a.a src/libqtpass.a
          make -j"$(nproc)" sub-main 2>&1 | tail -40
          find . -name '*.so' -o -name '*.a' -o -name '*deployment-settings.json' | head
      - name: Package the APK
        run: |
          set -x
          cd build
          mkdir -p android-build/libs/arm64-v8a
          cp main/libqtpass_arm64-v8a.so android-build/libs/arm64-v8a/
          "$QT_ROOT_DIR/../gcc_64/bin/androiddeployqt" \
            --input main/android-qtpass-deployment-settings.json \
            --output android-build --android-platform android-35 \
            --jdk "$JAVA_HOME" --gradle 2>&1 | tail -40
          find android-build -name '*.apk' -exec ls -l {} +
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qtpass-android-probe
          path: |
            build/android-build/build/outputs/apk/**/*.apk
            build/main/android-qtpass-deployment-settings.json
          if-no-files-found: warn

  # A second build targeting x86_64 purely so the "does it launch" check
  # below can run on a KVM-accelerated ubuntu runner. (GitHub's hosted
  # macos-14 runners do not expose Hypervisor.framework for nested
  # virtualization, so an arm64 emulator can't boot there: QEMU fails
  # immediately with "HVF error: HV_UNSUPPORTED". ubuntu + KVM + x86_64 is
  # the combination GitHub Actions actually supports for emulator boot.)
  apk-x86_64:
    runs-on: ubuntu-24.04
    env:
      QT_VERSION: "6.8.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: NDK the Qt version expects
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_x86_64
          autodesktop: true
          cache: true
      - name: Build src and main
        run: |
          set -x
          mkdir build && cd build
          "$QT_ROOT_DIR/bin/qmake" ../qtpass.pro CONFIG+=release ANDROID_ABIS=x86_64
          make -j"$(nproc)" sub-src 2>&1 | tail -20
          cp src/libqtpass_x86_64.a src/libqtpass.a
          make -j"$(nproc)" sub-main 2>&1 | tail -40
          find . -name '*.so' -o -name '*.a' -o -name '*deployment-settings.json' | head
      - name: Package the APK
        run: |
          set -x
          cd build
          mkdir -p android-build/libs/x86_64
          cp main/libqtpass_x86_64.so android-build/libs/x86_64/
          "$QT_ROOT_DIR/../gcc_64/bin/androiddeployqt" \
            --input main/android-qtpass-deployment-settings.json \
            --output android-build --android-platform android-35 \
            --jdk "$JAVA_HOME" --gradle 2>&1 | tail -40
          find android-build -name '*.apk' -exec ls -l {} +
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qtpass-android-probe-x86_64
          path: |
            build/android-build/build/outputs/apk/**/*.apk
            build/main/android-qtpass-deployment-settings.json
          if-no-files-found: warn

  run:
    needs: apk-x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qtpass-android-probe-x86_64
          path: artifact
      - name: Write the launch-check script
        run: |
          cat > probe.sh <<'SCRIPT'
          set -x
          apk=$(find artifact -name '*.apk' | head -1)
          pkg=org.qtproject.example.qtpass
          activity=org.qtproject.qt.android.bindings.QtActivity
          adb install -r "$apk"
          adb logcat -c
          adb shell am start -n "$pkg/$activity"
          sleep 20
          adb shell "pidof $pkg || ps -A | grep $pkg" && echo "ALIVE after 20s" || echo "NOT RUNNING after 20s (crashed or exited)"
          adb exec-out screencap -p > screen.png
          adb shell dumpsys window windows | grep -i "mCurrentFocus\|mFocusedApp" > focus.txt
          cat focus.txt
          adb logcat -d > logcat.txt
          echo "---- full logcat tag summary ----"
          cut -d' ' -f6 logcat.txt | sed 's/:$//' | sort | uniq -c | sort -rn | head -40
          echo "---- app package, Qt, qtpass category, warnings and errors ----"
          grep -iE "$pkg|fatal|androidruntime|qtpass| Qt |qt_|libqtpass|gpg|git| W | E " logcat.txt | tail -300
          SCRIPT
          chmod +x probe.sh
      - name: Boot a KVM-accelerated emulator and launch the APK
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # The action runs each line of `script:` as its own separate
          # shell invocation, so variables set in one line don't exist in
          # the next. Run one line here that execs a real script instead.
          script: ./probe.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qtpass-android-probe-logcat
          path: |
            logcat.txt
            screen.png
            focus.txt
          if-no-files-found: warn
